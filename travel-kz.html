<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel KZ — Қазақстан бойынша нұсқаулық</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=swap">
<style>
/* ============ Travel KZ: стили ============ */
:root {
    --ink: #1d302c;
    --muted: #6f7a73;
    --paper: #f8f8f3;
    --white: #fff;
    --line: #e8e9e2;
    --green: #214e43;
    --green-dark: #173b32;
    --lime: #d8e878;
    --sand: #eadcbf;
    --accent: #789055;
    --danger: #a0432f;
    --serif: Georgia, "Times New Roman", serif;
    --sans: "Inter", "Segoe UI", sans-serif;
    --display: "Manrope", "Segoe UI", sans-serif;
    --ease: cubic-bezier(.22, .8, .24, 1);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 20px; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin-top: 0; }
img { max-width: 100%; }
.page-shell { max-width: 1440px; margin: 0 auto; padding: 0 7.1%; overflow-x: clip; animation: page-in .7s var(--ease) both; }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.muted { color: var(--muted); }
.small-text { font-size: 12px; }

/* ----- Анимации страницы ----- */
@keyframes page-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.curtain { position: fixed; inset: 0; z-index: 999; background: var(--green); pointer-events: none; transform: translateY(-100%); animation: curtain-open .75s var(--ease) both; }
.curtain::after { content: "travelkz"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--lime); font: 800 28px var(--display); letter-spacing: -1px; opacity: .9; }
@keyframes curtain-open { 0% { transform: translateY(0); } 100% { transform: translateY(-100%); } }
.is-leaving .curtain { animation: none; transform: translateY(0); transition: transform .38s var(--ease); pointer-events: all; }

.js .reveal { opacity: 0; transform: translateY(26px); transition: opacity .7s var(--ease), transform .7s var(--ease); transition-delay: calc(var(--i, 0) * 80ms); }
.js .reveal.in { opacity: 1; transform: none; }
.js .bar-fill { width: 0; }
.js .in .bar-fill, .js .bar-fill.in { width: var(--w); }

/* ----- Шапка ----- */
.topbar { min-height: 88px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid rgba(29,48,44,.1); }
.brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -1px; }
.brand-accent { color: var(--accent); }
.brand-mark { width: 25px; height: 25px; display: flex; align-items: flex-end; justify-content: center; gap: 2px; padding: 4px 3px; background: var(--green); border-radius: 8px 8px 8px 2px; transform: rotate(-4deg); transition: transform .4s var(--ease); }
.brand:hover .brand-mark { transform: rotate(6deg) scale(1.1); }
.brand-mark span { display: block; width: 4px; border-radius: 5px 5px 1px 1px; background: var(--lime); transform: skewY(-25deg); }
.brand-mark span:nth-child(1) { height: 8px; opacity: .7; }
.brand-mark span:nth-child(2) { height: 13px; }
.brand-mark span:nth-child(3) { height: 10px; opacity: .82; }
.top-nav { flex: 1; align-self: stretch; display: flex; align-items: center; gap: 26px; margin-left: 34px; }
.top-nav a { align-self: stretch; display: flex; align-items: center; position: relative; color: #6c7771; font-size: 12.5px; font-weight: 600; transition: color .2s; }
.top-nav a:hover, .top-nav a.nav-active { color: var(--ink); }
.top-nav a::after { content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .3s var(--ease); }
.top-nav a:hover::after, .top-nav a.nav-active::after { transform: scaleX(1); }
.header-link { font-size: 12.5px; font-weight: 700; color: var(--green); white-space: nowrap; }
.header-link span { font-size: 17px; margin-left: 4px; display: inline-block; transition: transform .25s; }
.header-link:hover span { transform: translate(3px, -3px); }
.breadcrumbs { display: flex; flex-wrap: wrap; gap: 8px; padding: 18px 0 0; font-size: 12px; color: var(--muted); }
.breadcrumbs a:hover { color: var(--green); text-decoration: underline; }
.crumb-sep { color: #c3c8bd; }
.crumb-current { color: var(--ink); font-weight: 600; }

/* ----- Заголовки и общие элементы ----- */
.eyebrow { display: flex; align-items: center; gap: 9px; color: #7d8878; font-size: 10px; font-weight: 700; letter-spacing: 1.6px; }
.eyebrow-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #91a95c; box-shadow: 0 0 0 4px #edf0de; animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 4px #edf0de; } 50% { box-shadow: 0 0 0 8px rgba(237,240,222,.4); } }
h1 { margin: 20px 0 18px; font: 500 clamp(36px, 4.2vw, 56px)/1.1 var(--display); letter-spacing: -2.2px; }
h1 em { color: #5d7655; font-family: var(--serif); font-weight: 400; letter-spacing: -1.6px; }
h2 { font: 700 clamp(24px, 2.6vw, 34px)/1.2 var(--display); letter-spacing: -1.2px; margin-bottom: 8px; }
h3 { font: 700 18px/1.25 var(--display); letter-spacing: -.4px; margin-bottom: 8px; }
.section { padding: 64px 0 24px; }
.section.tight { padding-top: 28px; }
.section-tint { margin: 40px -7.1% 0; padding: 64px 7.1% 56px; background: #f0f2e6; }
.section-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 26px; }
.section-heading .eyebrow { margin-bottom: 11px; }
.section-heading p { color: #7f887f; font-size: 13px; margin-bottom: 0; max-width: 560px; }
.text-link { color: var(--green); font-size: 13px; font-weight: 700; white-space: nowrap; }
.text-link span { display: inline-block; transition: transform .25s; }
.text-link:hover span { transform: translateX(4px); }
.page-hero { padding: 44px 0 14px; max-width: 760px; }
.page-hero p { color: #6f7a73; font-size: 15px; line-height: 1.75; max-width: 600px; }

.primary-button { margin-top: 6px; padding: 13px 18px; display: inline-flex; align-items: center; gap: 22px; border-radius: 6px; background: var(--green); color: #fff; font-size: 12.5px; font-weight: 700; box-shadow: 0 7px 18px rgba(33,78,67,.15); transition: transform .25s var(--ease), background .2s, box-shadow .25s; }
.primary-button:hover { transform: translateY(-3px); background: var(--green-dark); box-shadow: 0 12px 26px rgba(33,78,67,.22); }
.primary-button span { font-size: 16px; color: var(--lime); transition: transform .25s; }
.primary-button:hover span { transform: translateX(4px); }
.primary-button.small { padding: 10px 15px; font-size: 12px; }
.primary-button.light { background: var(--lime); color: var(--green-dark); box-shadow: none; }
.primary-button.light span { color: var(--green-dark); }
.primary-button.light:hover { background: #e4f08f; }
.ghost-button { margin-top: 6px; padding: 12px 18px; display: inline-flex; align-items: center; border: 1px solid #cfd5c8; border-radius: 6px; font-size: 12.5px; font-weight: 700; color: var(--green); background: transparent; cursor: pointer; transition: background .2s, border-color .2s; }
.ghost-button:hover { background: #fff; border-color: var(--accent); }
.ghost-button.dark { border-color: var(--green); }

/* ----- Главная: hero ----- */
.hero { display: grid; grid-template-columns: .98fr 1.02fr; gap: 6%; align-items: center; padding: 56px 0 50px; }
.hero-copy > p { max-width: 460px; margin: 0; color: #6f7a73; font-size: 14px; line-height: 1.8; }
.hero-search { display: flex; max-width: 460px; margin-top: 24px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: #fff; box-shadow: 0 8px 24px rgba(33,78,67,.06); transition: box-shadow .25s, border-color .25s; }
.hero-search:focus-within { border-color: #b5c59a; box-shadow: 0 10px 30px rgba(33,78,67,.12); }
.hero-search input { flex: 1; min-width: 0; padding: 0 12px; border: 0; outline: 0; background: transparent; font-size: 13px; }
.hero-search button { padding: 11px 16px; border: 0; border-radius: 5px; background: var(--green); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; transition: background .2s; }
.hero-search button:hover { background: var(--green-dark); }
.hero-search button span { color: var(--lime); margin-left: 6px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.hero-footnote { margin-top: 32px; color: #9a9e92; font-size: 11px; }
.tiny-sparkle { color: #91a95c; font-size: 15px; margin-right: 6px; }
.hero-art { position: relative; aspect-ratio: 16 / 9; min-height: 0; align-self: center; overflow: hidden; border-radius: 6px 70px 6px 6px; background: linear-gradient(180deg, #d7e3d9 0%, #b9d0c5 49%, #71978a 50%, #416c60 100%); box-shadow: 0 17px 45px rgba(41,67,56,.14); isolation: isolate; }
.hero-art::before { content: ""; position: absolute; z-index: -1; inset: 0; opacity: .22; background-image: radial-gradient(#fff .7px, transparent .7px); background-size: 5px 5px; mix-blend-mode: soft-light; }
.sun { position: absolute; top: 55px; right: 18%; width: 86px; height: 86px; border-radius: 50%; background: #efdca9; box-shadow: 0 0 0 14px rgba(239,220,169,.17), 0 0 50px rgba(239,220,169,.25); animation: sun-glow 5s ease-in-out infinite; }
@keyframes sun-glow { 0%, 100% { box-shadow: 0 0 0 14px rgba(239,220,169,.17), 0 0 50px rgba(239,220,169,.25); } 50% { box-shadow: 0 0 0 26px rgba(239,220,169,.1), 0 0 80px rgba(239,220,169,.4); } }
.cloud { position: absolute; height: 14px; border-radius: 20px; background: rgba(255,255,255,.65); animation: drift 26s linear infinite; }
.cloud::before { content: ""; position: absolute; left: 18%; top: -9px; width: 40%; height: 18px; border-radius: 20px; background: inherit; }
.cloud-a { top: 70px; left: -90px; width: 90px; }
.cloud-b { top: 125px; left: -140px; width: 130px; animation-duration: 38s; animation-delay: -14s; opacity: .8; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(760px); } }
.mountain { position: absolute; bottom: 90px; left: -4%; width: 112%; height: 65%; clip-path: polygon(0 100%, 0 76%, 13% 47%, 24% 59%, 39% 5%, 54% 50%, 63% 32%, 76% 63%, 86% 42%, 100% 70%, 100% 100%); }
.mountain-back { background: linear-gradient(145deg, #e5e6d4 4%, #8ca89b 40%, #66877d 100%); opacity: .9; animation: rise 1.2s var(--ease) both; }
.mountain-front { left: -2%; bottom: 70px; height: 59%; background: linear-gradient(150deg, #a8b9a8, #466c5e 61%, #31594e); clip-path: polygon(0 100%, 0 79%, 20% 49%, 32% 65%, 50% 17%, 60% 51%, 73% 28%, 100% 76%, 100% 100%); animation: rise 1.4s .15s var(--ease) both; }
@keyframes rise { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
.lake { position: absolute; bottom: 0; height: 110px; left: 0; right: 0; background: linear-gradient(180deg, #638c7f, #284f46); overflow: hidden; }
.lake::before { content: ""; position: absolute; height: 2px; width: 54%; top: 30px; right: 5%; background: rgba(226,218,185,.36); box-shadow: 18px 11px 0 -.5px rgba(226,218,185,.28), -16px 21px 0 -.5px rgba(226,218,185,.19), 70px 32px 0 -.5px rgba(226,218,185,.27); animation: shimmer 6s ease-in-out infinite; }
@keyframes shimmer { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-18px); } }
.art-label { position: absolute; z-index: 1; left: 25px; bottom: 22px; display: flex; gap: 13px; align-items: center; color: rgba(255,255,255,.88); font-size: 10px; letter-spacing: .4px; }
.art-label span:first-child { color: var(--lime); font-size: 9px; letter-spacing: 1px; }
.art-stamp { position: absolute; top: 20px; left: 22px; width: 46px; height: 46px; border: 1px solid rgba(255,255,255,.55); border-radius: 50%; display: grid; align-content: center; justify-items: center; color: #fff; font-family: var(--serif); font-size: 15px; line-height: 1; transform: rotate(-12deg); }
.art-stamp span { font: 5px var(--sans); letter-spacing: 1px; margin-top: 3px; }

/* Басты беттегі фото (Көлсай) */
.hero-art .hero-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 66%; display: block; }
.hero-art::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(10,30,25,.22) 0%, rgba(10,30,25,0) 28%, rgba(10,30,25,0) 58%, rgba(10,30,25,.62) 100%); }
.hero-art .art-label, .hero-art .art-stamp { z-index: 2; }

/* ----- Статистика ----- */
.stats { display: flex; align-items: center; padding: 22px 25px; border: 1px solid var(--line); background: rgba(255,255,255,.7); border-radius: 6px; }
.stat-item { flex: 1; display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 20px; border-right: 1px solid var(--line); }
.stat-item:first-child { padding-left: 0; }
.stat-item:last-child { border: 0; }
.stat-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: #f0f2e6; color: #73885b; font-size: 17px; }
.stat-item div { display: grid; gap: 2px; }
.stat-item strong { font: 700 18px var(--display); letter-spacing: -.5px; }
.stat-item div > span { color: #8a928a; font-size: 11px; }

/* ----- Карточки городов ----- */
.city-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.city-card { position: relative; display: flex; flex-direction: column; min-height: 250px; padding: 24px; border-radius: 6px 36px 6px 6px; color: #fff; overflow: hidden; background: var(--c1); background: linear-gradient(155deg, var(--c1), color-mix(in srgb, var(--c1) 60%, #0e2a24)); transition: transform .35s var(--ease), box-shadow .35s var(--ease); }
.city-card::before { content: ""; position: absolute; right: -50px; bottom: -60px; width: 220px; height: 220px; border-radius: 50%; background: var(--c2); opacity: .22; transition: transform .6s var(--ease); }
.city-card:hover { transform: translateY(-6px); box-shadow: 0 22px 40px rgba(33,60,50,.22); }
.city-card:hover::before { transform: scale(1.3); }
.city-card > * { position: relative; }
.city-region { font-size: 10px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; opacity: .8; }
.city-card h3 { margin: 12px 0 6px; font-size: 30px; letter-spacing: -1px; }
.city-card p { margin: 0; font-family: var(--serif); font-style: italic; opacity: .9; }
.city-foot { margin-top: auto; padding-top: 24px; font-size: 12px; font-weight: 600; }
.arrow { display: inline-block; margin-left: 6px; color: var(--lime); transition: transform .25s; }
.city-card:hover .arrow { transform: translateX(6px); }

.city-list { display: grid; gap: 20px; }
.city-row { display: grid; grid-template-columns: 220px 1fr; border: 1px solid var(--line); border-radius: 6px; background: #fff; overflow: hidden; transition: box-shadow .3s, transform .3s var(--ease); }
.city-row:hover { box-shadow: 0 16px 36px rgba(33,60,50,.1); }
.city-row-art { display: grid; place-items: center; background: var(--c1); background: linear-gradient(155deg, var(--c1), color-mix(in srgb, var(--c1) 60%, #0e2a24)); position: relative; overflow: hidden; }
.city-row-art::after { content: ""; position: absolute; width: 180px; height: 180px; border-radius: 50%; background: var(--c2); opacity: .22; right: -60px; bottom: -70px; }
.city-row-art span { position: relative; color: #fff; font: 500 96px/1 var(--serif); opacity: .92; }
.city-row-art.has-img { min-height: 220px; }
.city-row-art.has-img::after { inset: 0; width: auto; height: auto; right: auto; bottom: auto; border-radius: 0; opacity: 1; background: linear-gradient(180deg, transparent 55%, color-mix(in srgb, var(--c1) 70%, #0e2a24) 100%); mix-blend-mode: multiply; }
.city-row-art.has-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.city-row-body { padding: 26px 28px; }
.city-row-body .city-region { color: var(--accent); opacity: 1; }
.city-row-body h2 { margin: 8px 0 10px; }
.city-row-body > p { color: #6f7a73; font-size: 14px; line-height: 1.7; }
.mini-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 18px 0; }
.mini-facts dt { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #8a928a; margin-bottom: 4px; }
.mini-facts dd { margin: 0; font-size: 13px; color: #55625b; line-height: 1.6; }
.spot-names { font-size: 13px; color: #55625b; margin-bottom: 16px !important; }

/* ----- Карточки мест ----- */
.place-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.place-card { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 6px; background: #fff; overflow: hidden; transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .25s; }
.place-card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(33,60,50,.13); border-color: #d3dac6; }
.place-thumb { position: relative; height: 150px; padding: 14px; background: linear-gradient(145deg, var(--c2), var(--c1)); overflow: hidden; }
.place-thumb::before, .place-thumb::after { content: ""; position: absolute; border-radius: 50%; background: #fff; opacity: .12; transition: transform .6s var(--ease); }
.place-thumb::before { width: 170px; height: 170px; right: -50px; top: -60px; }
.place-thumb::after { width: 100px; height: 100px; left: -30px; bottom: -40px; }
.place-card:hover .place-thumb::before { transform: scale(1.25); }
.thumb-glyph { position: absolute; right: 18px; bottom: 6px; color: #fff; font-size: 64px; line-height: 1; opacity: .9; transition: transform .5s var(--ease); }
.place-card:hover .thumb-glyph { transform: translateY(-6px) rotate(-6deg) scale(1.08); }
.thumb-cat, .thumb-city { position: relative; display: inline-block; padding: 4px 9px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: .5px; }
.thumb-cat { background: rgba(255,255,255,.9); color: var(--green); }
.thumb-city { margin-left: 6px; background: rgba(0,0,0,.22); color: #fff; }
.place-body { display: flex; flex-direction: column; flex: 1; padding: 18px; }
.place-body h3 { margin-bottom: 6px; }
.place-body p { color: #77817a; font-size: 12.5px; line-height: 1.65; margin-bottom: 14px; }
.place-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: auto; padding-top: 12px; border-top: 1px solid #f0f1ec; font-size: 11px; color: #8a928a; }
.price-tag { padding: 5px 10px; border-radius: 20px; background: #eef2de; color: #3f5a2f; font-size: 11.5px; font-weight: 700; white-space: nowrap; }

/* ----- Маршруты ----- */
.route-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.route-teaser { display: flex; flex-direction: column; padding: 22px; border: 1px solid #dfe3d2; border-radius: 6px; background: #fff; transition: transform .35s var(--ease), box-shadow .35s var(--ease); }
.route-teaser:hover { transform: translateY(-5px); box-shadow: 0 18px 34px rgba(33,60,50,.12); }
.route-level { display: inline-block; align-self: flex-start; margin-bottom: 12px; padding: 4px 10px; border-radius: 20px; background: #eef2de; color: #4b6a38; font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; }
.route-teaser p { color: #77817a; font-size: 13px; line-height: 1.65; }
.route-foot { margin-top: auto; padding-top: 14px; font-size: 12px; font-weight: 700; color: var(--green); }
.route-section { padding-top: 48px; }
.route-head { display: flex; justify-content: space-between; gap: 30px; align-items: flex-start; margin-bottom: 24px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.route-head p { color: #6f7a73; max-width: 520px; font-size: 14px; line-height: 1.7; margin-bottom: 0; }
.route-totals { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.route-totals div { min-width: 120px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.route-totals span { display: block; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #8a928a; }
.route-totals strong { font: 700 18px var(--display); letter-spacing: -.5px; }
.route-totals strong.small { font-size: 13px; }
.timeline { position: relative; display: grid; gap: 16px; }
.day-block { display: grid; grid-template-columns: 88px 1fr; gap: 18px; }
.day-label { display: grid; align-content: center; justify-items: center; padding: 12px 0; border-radius: 6px; background: var(--green); color: #fff; }
.day-label span { font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--lime); }
.day-label strong { font: 800 30px/1 var(--display); }
.day-stops { display: grid; gap: 8px; }
.stop { display: grid; grid-template-columns: 90px 1fr auto; gap: 16px; align-items: center; padding: 14px 18px; border: 1px solid var(--line); border-radius: 6px; background: #fff; transition: transform .25s var(--ease), border-color .2s, box-shadow .25s; }
.stop:hover { transform: translateX(6px); border-color: #c9d4b5; box-shadow: 0 8px 22px rgba(33,60,50,.08); }
.stop-time { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .8px; }
.stop-main { display: grid; gap: 2px; }
.stop-main strong { font: 700 14px var(--display); }
.stop-main small { color: #86908a; font-size: 12px; }
.stop-price { font-size: 12px; font-weight: 700; color: #3f5a2f; white-space: nowrap; }
.route-actions { margin-top: 18px; }

/* ----- Столбики ----- */
.bar-list { display: grid; gap: 12px; margin-top: 22px; padding: 22px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.bar-row { display: grid; grid-template-columns: 110px 1fr 120px; align-items: center; gap: 14px; font-size: 13px; }
.bar-label { font-weight: 700; }
.bar-track { display: block; height: 12px; border-radius: 12px; background: #eef0e6; overflow: hidden; }
.bar-track.thin { height: 6px; margin: 6px 0; }
.bar-fill { display: block; height: 100%; width: var(--w); border-radius: 12px; background: linear-gradient(90deg, #7f9a5c, #b8cf6a); transition: width 1.2s var(--ease) .2s; }
.bar-value { text-align: right; font-weight: 700; color: var(--green); }

/* ----- Баннер ----- */
.cta-banner { display: flex; justify-content: space-between; align-items: center; gap: 24px; margin: 56px 0 0; padding: 36px 40px; border-radius: 6px 50px 6px 6px; background: linear-gradient(120deg, var(--green), #2f6a5b); color: #fff; }
.cta-banner h2 { color: #fff; margin-bottom: 6px; }
.cta-banner p { margin: 0; color: #cfe0d8; font-size: 14px; }

/* ----- Фильтры, чипы, таблицы ----- */
.filter-panel { display: flex; flex-wrap: wrap; gap: 9px; padding: 9px; border: 1px solid var(--line); border-radius: 6px; background: rgba(255,255,255,.8); }
.search-box { flex: 1 1 240px; min-width: 160px; display: flex; align-items: center; gap: 9px; padding: 0 11px; }
.search-icon { color: #85927e; font-size: 23px; line-height: 1; transform: rotate(-20deg); }
.search-box input { width: 100%; padding: 10px 0; border: 0; outline: 0; background: transparent; font-size: 13px; }
.select-wrap { position: relative; display: flex; align-items: center; border-left: 1px solid var(--line); }
.select-wrap select { appearance: none; padding: 10px 28px 10px 14px; border: 0; outline: 0; background: transparent; font-size: 12.5px; cursor: pointer; }
.select-wrap::after { content: "⌄"; position: absolute; right: 10px; top: 8px; pointer-events: none; color: #8a9388; font-size: 16px; }
.check-wrap { display: flex; align-items: center; gap: 7px; padding: 0 12px; border-left: 1px solid var(--line); font-size: 12.5px; cursor: pointer; }
.check-wrap input, .check-item input { accent-color: var(--green); width: 16px; height: 16px; }
.search-button, .save-button { display: inline-flex; justify-content: center; align-items: center; gap: 13px; border: 0; border-radius: 5px; background: var(--green); color: #fff; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: background .2s, transform .2s; }
.search-button { padding: 0 20px; min-height: 40px; }
.save-button { padding: 13px 20px; }
.search-button:hover, .save-button:hover { background: var(--green-dark); transform: translateY(-1px); }
.search-button span, .save-button span { color: var(--lime); font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chip { padding: 7px 14px; border: 1px solid var(--line); border-radius: 30px; background: #fff; font-size: 12px; font-weight: 600; color: #55625b; transition: all .2s; }
.chip:hover { border-color: var(--accent); color: var(--green); transform: translateY(-2px); }
.chip-active { background: var(--green); border-color: var(--green); color: #fff; }
.chip-active:hover { color: #fff; }
.results-line { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin: 20px 0 14px; color: #8a928a; font-size: 12px; }
.results-line strong { color: var(--ink); }
.results-tools { display: flex; align-items: center; gap: 14px; }
.clear-filter { color: #5d7655; font-weight: 700; font-size: 12px; }
.view-switch { padding: 5px 12px; border-radius: 20px; border: 1px solid var(--line); font-weight: 600; color: #6f7a73; }
.view-switch.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.data-table { width: 100%; border-collapse: collapse; text-align: left; }
.data-table thead { background: #f2f3ed; }
.data-table th { padding: 13px 14px; color: #8a9288; font-size: 9.5px; font-weight: 700; letter-spacing: .9px; white-space: nowrap; }
.data-table td { padding: 14px; border-top: 1px solid #eff0eb; color: #5d6a62; font-size: 12.5px; vertical-align: middle; }
.data-table tbody tr { transition: background .15s; }
.data-table tbody tr:hover { background: #fbfcf8; }
.table-link { color: var(--green); font-weight: 700; }
.table-link:hover { text-decoration: underline; }
.place-cell { display: flex; align-items: center; gap: 12px; min-width: 200px; }
.place-number { display: grid; place-items: center; width: 28px; height: 28px; flex: 0 0 28px; border-radius: 4px; background: #f0f2e9; color: #819264; font: 600 10px var(--display); }
.place-name { color: #263c34; font-weight: 700; }
.city-tag { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.city-tag span { width: 5px; height: 5px; border-radius: 50%; background: #9cad72; }
.price { white-space: nowrap; color: #344d41; font-weight: 700; }
.action-cell { text-align: right; white-space: nowrap; }
.empty-cell { text-align: center; color: var(--muted); padding: 30px !important; }
.table-footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 14px 3px 0; color: #8f968c; font-size: 12px; }
.table-footer strong { margin-left: 6px; color: var(--green); }
.empty-block { display: grid; justify-items: center; gap: 4px; padding: 54px 20px; border: 1px dashed #d4d9ca; border-radius: 6px; background: #fff; text-align: center; color: #68776d; }
.empty-block > span { color: #a4b17e; font-size: 30px; }
.empty-block strong { font: 700 15px var(--display); color: #3f5649; }
.empty-block small { color: #929a91; }
.badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 10.5px; font-weight: 700; white-space: nowrap; }
.badge-ok { background: #e6f0d2; color: #3f5a2f; }
.badge-est { background: #fbeed5; color: #8a5a14; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 6px; }
.dot-ok { background: #7ea34a; }
.dot-est { background: #d9a13a; }
.legend { margin-top: 12px; font-size: 12px; color: #8a928a; }
.legend .dot { margin: 0 4px 0 12px; }
.legend .dot:first-child { margin-left: 0; }

/* ----- Страница города и места ----- */
.detail-hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 30px; align-items: end; margin-top: 26px; padding: 44px; border-radius: 6px 60px 6px 6px; color: #fff; position: relative; overflow: hidden; background: var(--c1); background: linear-gradient(150deg, var(--c1), color-mix(in srgb, var(--c1) 55%, #0e2a24)); }
.detail-hero::before { content: ""; position: absolute; width: 380px; height: 380px; right: -100px; top: -140px; border-radius: 50%; background: var(--c2); opacity: .2; animation: float 9s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(22px); } }
.detail-hero > * { position: relative; }
.detail-kicker { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; opacity: .85; }
.detail-hero h1 { margin: 12px 0 14px; font-size: clamp(34px, 4vw, 52px); color: #fff; }
.detail-hero p { max-width: 560px; margin-bottom: 20px; font-size: 14.5px; line-height: 1.75; opacity: .92; }
.detail-hero-stats { display: grid; gap: 10px; }
.detail-hero-stats div { padding: 14px 18px; border-radius: 6px; background: rgba(255,255,255,.14); backdrop-filter: blur(4px); }
.detail-hero-stats strong { display: block; font: 800 24px var(--display); letter-spacing: -.6px; }
.detail-hero-stats span { font-size: 12px; opacity: .85; }
.detail-hero-price { justify-self: end; text-align: right; display: grid; gap: 8px; justify-items: end; }
.detail-hero-price .label { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; opacity: .85; }
.detail-hero-price strong { font: 800 clamp(28px, 3.4vw, 42px) var(--display); letter-spacing: -1.2px; }
.fact-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.fact-grid.four { grid-template-columns: repeat(4, 1fr); }
.fact { padding: 18px 20px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.fact span { display: block; margin-bottom: 6px; color: #8a928a; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }
.fact p { margin: 0; color: #3a4d44; font-size: 13.5px; font-weight: 600; line-height: 1.55; }
.detail-columns { display: grid; grid-template-columns: 1.6fr 1fr; gap: 28px; align-items: start; }
.detail-main p { color: #5d6a62; font-size: 14.5px; line-height: 1.85; }
.detail-main .address { font-size: 13px; padding-top: 10px; border-top: 1px solid var(--line); }
.detail-side { display: grid; gap: 14px; }
.callout { padding: 20px 22px; border-radius: 6px; background: var(--green); color: #fff; }
.callout > span { display: block; margin-bottom: 8px; color: var(--lime); font-size: 10px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; }
.callout p { margin: 0; font-size: 13px; line-height: 1.7; }
.callout-soft { background: #f0f2e6; color: var(--ink); border: 1px solid #e0e5d0; }
.callout-soft > span { color: #6d8450; }
.callout form { margin-top: 14px; }
.plain-list { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.9; }
.pager { display: flex; justify-content: space-between; align-items: center; margin-top: 56px; padding: 18px 0; border-top: 1px solid var(--line); font-size: 13px; font-weight: 700; color: var(--green); }
.pager a { transition: transform .2s; }
.pager a:hover { transform: translateY(-2px); }
.edit-panel { border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.edit-panel summary { padding: 16px 20px; list-style: none; cursor: pointer; color: var(--green); font-weight: 700; font-size: 13px; }
.edit-panel summary::-webkit-details-marker { display: none; }
.edit-panel[open] summary { border-bottom: 1px solid var(--line); color: var(--muted); }
.edit-panel .form-grid { padding: 20px; }

/* ----- Формы ----- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { display: grid; gap: 6px; color: #6d776f; font-size: 11px; font-weight: 700; letter-spacing: .3px; }
.field.wide { grid-column: 1 / -1; }
.field input, .field textarea, .field select { width: 100%; padding: 11px 12px; border: 1px solid #e0e5d8; border-radius: 5px; outline: 0; background: #fcfcfa; font-size: 13.5px; font-weight: 400; color: var(--ink); transition: border-color .2s, box-shadow .2s; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: #a8b780; box-shadow: 0 0 0 4px rgba(168,183,128,.2); }
.field textarea { resize: vertical; }
.notice { margin: 22px 0 0; padding: 13px 16px; border: 1px solid #dbe4c8; border-radius: 6px; background: #f0f4e5; color: #48623c; font-size: 13px; animation: page-in .5s var(--ease) both; }
.notice-error { border-color: #ecc9c0; background: #fbece8; color: var(--danger); }
.contact-layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 28px; align-items: start; }
.contact-form-wrap { padding: 28px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.contact-side { display: grid; gap: 14px; }
.success-box { display: grid; justify-items: start; gap: 10px; padding: 14px 0; }
.success-box p { margin: 0 0 8px; color: #5d6a62; }
.success-mark { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 50%; background: var(--lime); color: var(--green-dark); font-size: 26px; font-weight: 800; animation: pop .6s var(--ease) both; }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
.link-danger { border: 0; background: transparent; color: var(--danger); font-size: 12px; font-weight: 700; cursor: pointer; }
.link-danger:hover { text-decoration: underline; }
.admin-form { padding: 24px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }

/* ----- Калькулятор ----- */
.calc-layout { display: grid; grid-template-columns: 1.15fr 1fr; gap: 28px; align-items: start; }
.calc-form { display: grid; gap: 22px; padding: 28px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.calc-step h2 { font-size: 18px; letter-spacing: -.5px; margin-bottom: 14px; }
.check-list { display: grid; gap: 8px; }
.check-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; transition: border-color .2s, background .2s; }
.check-item:hover { border-color: #b9c79b; background: #fbfcf7; }
.check-item.soft { margin-top: 10px; background: #f6f8ee; }
.check-item:has(input:checked) { border-color: #8ea66a; background: #f2f6e6; }
.check-text { display: grid; gap: 2px; }
.check-text strong { font-size: 13.5px; }
.check-text small { color: #86908a; font-size: 11.5px; }
.calc-form .clear-filter { justify-self: start; }
.calc-result { position: sticky; top: 20px; padding: 26px; border-radius: 6px 40px 6px 6px; background: var(--green); color: #fff; }
.calc-result h2 { color: #fff; font-size: 20px; margin-bottom: 16px; }
.result-total { display: grid; gap: 4px; padding: 18px; margin-bottom: 18px; border-radius: 6px; background: rgba(255,255,255,.1); }
.result-total span { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--lime); }
.result-total strong { font: 800 clamp(28px, 3vw, 38px) var(--display); letter-spacing: -1.2px; }
.result-total small { color: #cfe0d8; font-size: 12.5px; }
.result-lines { display: grid; gap: 14px; margin: 0 0 16px; padding: 0; list-style: none; }
.line-top { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; }
.result-lines small { display: block; color: #b6cdc3; font-size: 11.5px; line-height: 1.5; }
.calc-result .bar-track { background: rgba(255,255,255,.16); }
.calc-result .muted { color: #b6cdc3; }
.result-empty { display: grid; justify-items: center; gap: 6px; padding: 30px 10px; text-align: center; }
.result-empty > span { color: var(--lime); font-size: 36px; }
.result-empty strong { font: 700 16px var(--display); }
.result-empty small { color: #b6cdc3; font-size: 12.5px; }

/* ----- Советы, источники, код ----- */
.tip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.tip-card { position: relative; padding: 24px; border: 1px solid var(--line); border-radius: 6px; background: #fff; overflow: hidden; transition: transform .3s var(--ease), box-shadow .3s; }
.tip-card:hover { transform: translateY(-5px); box-shadow: 0 16px 32px rgba(33,60,50,.1); }
.tip-number { position: absolute; right: 16px; top: 8px; font: 800 44px var(--display); color: #eef0e3; }
.tip-card h3, .tip-card p { position: relative; }
.tip-card p { margin: 0; color: #6f7a73; font-size: 13px; line-height: 1.75; }
.source-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.source-list li { display: flex; justify-content: space-between; gap: 16px; padding: 14px 18px; border: 1px solid #dfe3d2; border-radius: 6px; background: #fff; font-size: 13px; transition: transform .2s, border-color .2s; }
.source-list li:hover { transform: translateX(5px); border-color: #b9c79b; }
.source-list a { font-weight: 700; color: var(--green); }
.source-list li > span { color: #8a928a; text-align: right; }
.code-sample { margin: 16px 0; padding: 16px 18px; border-radius: 6px; background: #1d302c; color: #d8e878; font: 13px/1.7 Consolas, "Courier New", monospace; overflow-x: auto; }
code { padding: 2px 6px; border-radius: 4px; background: #eef0e3; font-size: .9em; }

/* ----- Подвал ----- */
.footer { margin-top: 72px; padding-top: 44px; border-top: 1px solid var(--line); }
.footer-grid { display: grid; grid-template-columns: 1.4fr .8fr .8fr 1.2fr; gap: 32px; }
.footer-brand { font-size: 18px; }
.footer-about p, .footer-note p { margin: 14px 0 0; color: #8a928a; font-size: 12px; line-height: 1.7; max-width: 320px; }
.footer-col { display: grid; align-content: start; gap: 8px; }
.footer-col h3 { margin-bottom: 6px; color: #8a928a; font: 700 10px var(--sans); letter-spacing: 1.4px; text-transform: uppercase; }
.footer-col a { color: #55625b; font-size: 13px; transition: color .2s, transform .2s; }
.footer-col a:hover { color: var(--green); transform: translateX(3px); }
.footer-note p { margin-top: 0; }
.footer-bottom { display: flex; justify-content: space-between; gap: 12px; margin-top: 36px; padding: 18px 0; border-top: 1px solid var(--line); color: #9ba198; font-size: 11px; }

/* ----- Адаптивность ----- */
@media (max-width: 1000px) {
    .page-shell { padding: 0 5%; }
    .section-tint { margin-left: -5%; margin-right: -5%; padding-left: 5%; padding-right: 5%; }
    .topbar { flex-wrap: wrap; padding: 14px 0 0; }
    .top-nav { order: 3; flex-basis: 100%; margin: 6px 0 0; overflow-x: auto; gap: 22px; padding-bottom: 0; scrollbar-width: none; }
    .top-nav a { min-height: 40px; white-space: nowrap; }
    .hero { grid-template-columns: 1fr; gap: 34px; }
    .city-grid, .route-grid, .tip-grid { grid-template-columns: repeat(2, 1fr); }
    .fact-grid.four { grid-template-columns: repeat(2, 1fr); }
    .detail-hero { grid-template-columns: 1fr; padding: 32px; }
    .detail-hero-price { justify-self: start; text-align: left; justify-items: start; }
    .detail-hero-stats { grid-template-columns: repeat(3, 1fr); }
    .detail-columns, .calc-layout, .contact-layout { grid-template-columns: 1fr; }
    .calc-result { position: static; }
    .footer-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 700px) {
    .page-shell { padding: 0 20px; }
    .section-tint { margin-left: -20px; margin-right: -20px; padding-left: 20px; padding-right: 20px; }
    .section { padding-top: 48px; }
    h1 { font-size: 38px; letter-spacing: -1.6px; }
    .header-link { display: none; }
    .hero-art { min-height: 0; border-top-right-radius: 48px; }
    .stats { flex-wrap: wrap; gap: 14px 0; padding: 16px 12px; }
    .stat-item { flex: 1 1 50%; padding: 0 8px; border-right: 0; }
    .stat-item:nth-child(odd) { border-right: 1px solid var(--line); }
    .section-heading { flex-direction: column; align-items: flex-start; }
    .city-grid, .route-grid, .tip-grid, .fact-grid, .fact-grid.four, .mini-facts, .form-grid { grid-template-columns: 1fr; }
    .city-row { grid-template-columns: 1fr; }
    .city-row-art, .city-row-art.has-img { min-height: 190px; }
    .city-row-art span { font-size: 64px; }
    .cta-banner { flex-direction: column; align-items: flex-start; padding: 28px 24px; }
    .route-head { flex-direction: column; }
    .route-totals { justify-content: flex-start; }
    .day-block { grid-template-columns: 1fr; }
    .day-label { grid-auto-flow: column; justify-content: start; gap: 10px; padding: 10px 16px; }
    .stop { grid-template-columns: 1fr; gap: 4px; }
    .bar-row { grid-template-columns: 80px 1fr; }
    .bar-value { grid-column: 1 / -1; text-align: left; }
    .filter-panel { flex-direction: column; }
    .select-wrap, .check-wrap { border-left: 0; border-top: 1px solid var(--line); }
    .search-button { justify-content: center; }
    .results-line { flex-direction: column; align-items: flex-start; }
    .detail-hero { padding: 26px 22px; border-top-right-radius: 40px; }
    .detail-hero-stats { grid-template-columns: 1fr; }
    .footer-grid { grid-template-columns: 1fr; }
    .footer-bottom { flex-direction: column; }
    .source-list li { flex-direction: column; gap: 4px; }
    .source-list li > span { text-align: left; }

    /* Таблицы превращаются в карточки */
    .table-wrap { border: 0; background: transparent; overflow: visible; }
    .data-table, .data-table tbody { display: block; width: 100%; }
    .data-table thead { display: none; }
    .data-table tbody tr { display: grid; gap: 8px; margin-bottom: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
    .data-table td { display: flex; justify-content: space-between; gap: 14px; padding: 0; border: 0; }
    .data-table td::before { content: attr(data-label); color: #9aa29a; font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; }
    .data-table td:first-child { display: block; }
    .data-table td:first-child::before { display: none; }
    .action-cell { text-align: left; }
}

@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .curtain { display: none; }
    .js .reveal { opacity: 1; transform: none; }
    .js .bar-fill { width: var(--w); }
}

/* ============ Обновление дизайна ============ */
:root { --sun: #f2b632; --sun-soft: #fdf1cf; --sky: #2f8fb5; }
body { font-size: 15px; line-height: 1.65; }

/* Читаемость: мелкий текст крупнее */
.eyebrow, .city-region, .thumb-cat, .thumb-city, .mini-facts dt, .footer-col h3 { font-size: 12px; }
.top-nav a, .header-link, .primary-button, .ghost-button, .text-link { font-size: 14px; }
.hero-copy > p, .place-body p, .section-heading p { font-size: 15px; }
.place-meta, .footer-bottom, .footer-about p, .footer-note p, .stat-item div > span { font-size: 13px; }
.price-tag { font-size: 13px; background: var(--sun-soft); color: #7a5600; }

/* Шапка закреплена и размыта */
.topbar { position: sticky; top: 0; z-index: 50; background: rgba(248,248,243,.86); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }

/* Карточки */
.place-card { border-radius: 14px; }
.place-card:hover { transform: translateY(-8px); }
.place-thumb { height: 180px; }
.thumb-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .7s var(--ease); }
.place-card:hover .thumb-img { transform: scale(1.08); }
.place-thumb.has-img::before { inset: 0; width: auto; height: auto; border-radius: 0; opacity: 1; background: linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,0) 40%, rgba(0,0,0,.35)); z-index: 1; }
.place-thumb.has-img::after { display: none; }
.thumb-cat, .thumb-city { z-index: 2; }
.city-card { border-radius: 14px 44px 14px 14px; min-height: 280px; }

/* Избранное */
.fav { position: absolute; z-index: 3; top: 10px; right: 10px; width: 38px; height: 38px; border: 0; border-radius: 50%; background: rgba(255,255,255,.92); color: #b2432f; font-size: 19px; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.15); transition: transform .25s var(--ease); }
.fav:hover { transform: scale(1.15); }
.fav.on { background: #b2432f; color: #fff; animation: pop .35s var(--ease); }
@keyframes pop { 50% { transform: scale(1.35); } }
.fav-link { padding: 8px 14px; border-radius: 20px; background: var(--sun-soft); color: #7a5600; font-size: 14px; font-weight: 700; white-space: nowrap; transition: transform .2s; }
.fav-link:hover { transform: translateY(-2px); }
.fav-note { margin: 18px 0 0; padding: 14px 18px; border-radius: 10px; background: var(--sun-soft); color: #7a5600; font-size: 14px; }

/* Место дня */
.potd { display: grid; grid-template-columns: 1.1fr .9fr; margin-top: 8px; border-radius: 20px; overflow: hidden; background: var(--green); color: #fff; box-shadow: 0 20px 50px rgba(33,78,67,.22); }
.potd-text { padding: 44px; }
.potd-text .eyebrow { color: var(--lime); }
.potd-text h2 { margin: 14px 0 12px; font-size: clamp(28px, 3vw, 40px); }
.potd-text p { color: rgba(255,255,255,.82); max-width: 460px; }
.potd-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 18px 0 20px; font-size: 14px; color: rgba(255,255,255,.8); }
.potd-art { min-height: 280px; display: grid; place-items: center; background: linear-gradient(145deg, #3f7a6a, #173b32) center / cover; color: rgba(255,255,255,.9); font-size: 110px; }

/* Мобильное меню */
.nav-toggle { display: none; width: 44px; height: 44px; border: 0; border-radius: 10px; background: var(--green); cursor: pointer; flex-direction: column; justify-content: center; align-items: center; gap: 5px; }
.nav-toggle span { width: 20px; height: 2px; background: var(--lime); border-radius: 2px; transition: transform .3s, opacity .3s; }
.nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
@media (max-width: 1000px) {
    .nav-toggle { display: flex; order: 2; margin-left: auto; }
    .top-nav { display: none; flex-direction: column; align-items: stretch; gap: 0; overflow: visible; padding-bottom: 12px; }
    .top-nav.open { display: flex; }
    .top-nav a { min-height: 48px; font-size: 16px; border-bottom: 1px solid var(--line); }
    .header-link { display: none; }
    .potd { grid-template-columns: 1fr; }
    .potd-art { order: -1; min-height: 200px; }
    .potd-text { padding: 28px; }
}

лқын. Жазда да жылы киім мен ыңғайлы жабық аяқ киім алыңыз."}, {"title": "Астанадағы қыс", "text": "Қыста Астанада температура −20 °C-тан төмен түседі. Мұражайларды, сауда орталықтарын және қысқа серуендерді жоспарлаңыз."}, {"title": "Оңтүстіктегі ыстық", "text": "Түркістанда жазда өте ыстық. Кесенені таңертең, Керуен-Сарайды кешке аралаңыз."}], "Этикет және жеңілдіктер": [{"title": "Киелі орындар", "text": "Кесене мен мешіттерге кіру үшін жабық киім қажет, әйелдерге — бас орамал."}, {"title": "Жеңілдікті билеттер", "text": "Көптеген объектілер балаларға, студенттерге және зейнеткерлерге төмендетілген баға ұсынады. Жеңілдікті растайтын құжаттарды өзіңізбен бірге алыңыз."}, {"title": "Тегін күндер", "text": "Ұлттық музейде тегін кіру күндері бар. Өзекті ережелерді музей сайтынан қараңыз."}]}},IMG={"karavansaray": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBwgQCAkICAgKCgkIBwoHBwcGBxsICggWIB0iIiAdHx8kHCgsJBolGx8fITEhJSkrLi4uIx8zODMsNygtLisBCgoKDg0OFQ8PFisZFRkrKysrKysrKysrLSstLSs3NzcrKy0rLTc3LTcrKy0tNys3LS0rLSstLSstNystKy0tLf/AABEIAOgBXAMBIgACEQEDEQH/xAAbAAACAgMBAAAAAAAAAAAAAAADBAIFAAEGB//EAEIQAAIBBAAEAwQHBgQGAQUAAAECAwAEERIFEyEiMTJBI0JRYQYUUnGBkaEzYrHB4fAVJHLRQ1NjgpLxoiVkssLS/8QAGgEAAwEBAQEAAAAAAAAAAAAAAAECAwQFBv/EACcRAAICAgICAwEAAQUAAAAAAAABAhEDIRIxQVETImEEMhQjQqGx/9oADAMBAAIRAxEAPwDo8CtaiiafEVrU132eZQIqPSoFG9R0o5Q1nXOCKfIXGwKA58aMnh1rZQeIqQX0pN2Uo0RaLI7agqdfnR1c/dUioPiKVtD4p9AgpxWGL4CjKnWpqopcilGxblHFZofDFOKvoajr1pch8BMJ161hU/CnTGCMjAoTxt6U+SFwoBWjmi6mtNG2fCixULnNDOc9aZZDnrWmj+FUnRDiLetYcUZ4jjwoRT0x1qrRLTIdMVvA6VNU+NEWHpRyQJMxNdcUJ8Z+dMCLArRh6ZqE0W4sAfCtxqSanp+VEUfCqbEo72bUAetTUjFQVTnJojKOlZstWYcY8KIqZAqGox40aEeFJlLsG6dcYosQwOlTdPlW40+NTZXGmT6YyaBcOPAUSRwB0pU5J6mnFeQnLwQUdaNocVuNRiiBRjr4U2yYoQlU56ihuh+FOSkb9OtDx8RVJkSiK6mthTTPL+VSENU5k8GLhKIqUcRiiLGKlzLUAaKMdKnn0qenwrNaiy6BmOthBjwp3RfhWGEelLmX8YiU+VRMfrinjD8qgyfKnyFwE9Dmt6n4Uzp8qwRGnyFxFTEceFYB6GneV0oTxfKjlYnCgSkURQPhUCmD4dKmDQxomq9a2UFYhogNQXoEVwMVFkyPnTDDIrQU5FFhQFIDittF0ptV6VjRGlyK4Fe0frQynXwp94jS return shell('', '<section class="hero"><div class="hero-copy"><div class="eyebrow"><span class="eyebrow-dot"></span> ҚАЗАҚСТАН БОЙЫНША НҰСҚАУЛЫҚ</div><h1>Шабыттандыратын<br><em>орындарға жақынырақ.</em></h1><p>Қазақстанның қалалары мен тамаша орындарын ашыңыз. Маршрутты таңдап, өзекті құнын біліп, сапар бюджетін есептеңіз.</p><form class="hero-search" id="hs"><input id="hq" type="search" placeholder="Мысалы: көлдер, музей, Астана" aria-label="Орын іздеу"><button type="submit">Іздеу <span>→</span></button></form><div class="hero-actions"><a class="primary-button" href="#/places">Орындарды көру <span>→</span></a><a class="ghost-button" href="#/calc">Сапарды есептеу</a></div></div><div class="hero-art" style="aspect-ratio:16/9;min-height:0"><img class="hero-photo" src="'+IMG.hero+'" alt="Көлсай көлі" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"><div class="art-label"><span>43°06′ N</span><span>Көлсай көлдері</span></div><div class="art-stamp">KZ<br><span>TRAVEL</span></div></div></section><section class="stats"><div class="stat-item"><span class="stat-icon">⌖</span><div><strong>'+Object.keys(C).length+'</strong><span>қала</span></div></div><div class="stat-item"><span class="stat-icon">✧</span><div><strong>'+all.length+'</strong><span>сапарға арналған орын</span></div></div><div class="stat-item"><span class="stat-icon">₸</span><div><strong>'+money(avg)+'</strong><span>орташа билет</span></div></div><div class="stat-item"><span class="stat-icon">♡</span><div><strong>'+free+'</strong><span>тегін орын</span></div></div></section><section class="section"><div class="section-heading"><div><h2>Қаланы таңдаңыз</h2><p>Үш түрлі мінез: тау, астана және оңтүстіктің рухани орталығы.</p></div><a class="text-link" href="#/cities">Барлық қалалар →</a></div><div class="city-grid">'+cities+'</div></section><section class="section"><div class="section-heading"><div><h2>Таңдаулы орындар</h2></div><a class="text-link" href="#/places">Барлық орындар →</a></div><div class="place-grid">'+feat+'</div></section><section class="section"><div class="section-heading"><div><h2>Дайын маршруттар</h2></div></div><div class="route-grid">'+routes+'</div></section>')};

return '<article class="city-row" style="--c1:'+ci.colors[0]+';--c2:'+ci.colors[1]+'"><div class="city-row-art has-img">'+(im?'<img src="'+im+'" alt="'+esc(ci.name)+'">':'<span>'+esc(ci.name[0])+'</span>')+'</div><div class="city-row-body"><span class="city-region">'+esc(ci.region)+'</span><h2>'+esc(ci.name)+'</h2><p>'+esc(ci.about)+'</p><dl class="mini-facts"><div><dt>Қашан бару керек</dt><dd>'+esc(ci.season)+'</dd></div><div><dt>Қалай жетуге болады</dt><dd>'+esc(ci.arrival)+'</dd></div></dl><p class="spot-names"><strong>Орындар:</strong> '+esc(names)+'</p><a class="primary-button small" href="#/places?city='+c+'">Орындарды көру <span>→</span></a></div></article>'}).join('');
return shell('cities',head('Қалалар','','Үш бағыт: сипаттама, маусым және жету жолдары.')+'<section class="section tight"><div class="city-list">'+h+'</div></section>')};
function list(q){var parts=(q.q||'').toLowerCase().split(',').map(function(x){return x.trim()}).filter(Boolean);
var r=rows().filter(function(x){if(q.city&&q.city!=='all'&&x.c!==q.city)return false;if(q.cat&&q.cat!=='all'&&x.s.category!==q.cat)return false;if(q.free==='1'&&+x.s.price>0)return false;var hs=(x.city+' '+x.s.name+' '+x.s.category+' '+x.s.description).toLowerCase();return parts.every(function(p){return hs.indexOf(p)>=0})});
var s=q.sort||'default';if(s!=='default')r.sort(function(a,b){if(s==='price_asc')return a.s.price-b.s.price;if(s==='price_desc')return b.s.price-a.s.price;if(s==='city'){var c=a.city.localeCompare(b.city);if(c)return c}return a.s.name.toLowerCase().localeCompare(b.s.name.toLowerCase())});return r}
V.places=function(q){var cats=[];rows().forEach(function(r){if(cats.indexOf(r.s.category)<0)cats.push(r.s.category)});cats.sort();
function opt(v,l,cur){return '<option value="'+esc(v)+'"'+(cur===v?' selected':'')+'>'+esc(l)+'</option>'}
var so={default:'Әдепкі бойынша',price_asc:'Алдымен арзандар',price_desc:'Алдымен қымбаттар',name:'Атауы бойынша',city:'Қала бойынша'};
return shell('places',head('Көруге <em>тұрарлық орындар.</em>','','Атауы немесе сипаттамасы бойынша іздеңіз, қала мен санатты таңдап, баға бойынша сұрыптаңыз.')+'<section class="section tight"><form class="filter-panel" id="fp" onsubmit="return false"><label class="search-box"><span class="search-icon">⌕</span><input name="q" type="search" value="'+esc(q.q||'')+'" placeholder="Орын табу. Бірнеше сөз — үтір арқылы"></label><label class="select-wrap"><select name="city">'+opt('all','Барлық қалалар',q.city||'all')+Object.keys(C).map(function(c){return opt(c,C[c].name,q.city)}).join('')+'</select></label><label class="select-wrap"><select name="cat">'+opt('all','Барлық санаттар',q.cat||'all')+cats.map(function(c){return opt(c,c,q.cat)}).join('')+'</select></label><label class="select-wrap"><select name="sort">'+Object.keys(so).map(function(k){return opt(k,so[k],q.sort||'default')}).join('')+'</select></label><label class="check-wrap"><input type="checkbox" name="free" value="1"'+(q.free==='1'?' checked':'')+'><span>Төлемсіз</span></label></form><div class="results-line" id="rl"></div><div id="pl"></div></section>')};
function fillPlaces(){var f=$('#fp');if(!f)return;var q={q:f.q.value,city:f.city.value,cat:f.cat.value,sort:f.sort.value,free:f.free.checked?'1':''},r=list(q);
$('#rl').innerHTML='<span>'+rows().length+' орыннан <strong>'+r.length+'</strong> табылды</span>';
$('#pl').innerHTML=r.length?'<div class="place-grid">'+r.map(card).join('')+'</div>':'<div class="empty-block"><span>⌕</span><strong>Ештеңе табылмады</strong><small>Сұрауды өзгертіп көріңіз.</small></div>'}
V.place=function(q,p){var c=p[1],k=p[2],s=(P[c]||{})[k];if(!s)return shell('places',head('Орын <em>табылмады.</em>','','Сілтеме қате немесе орын жойылған.'));var a=D.categoryArt[s.category]||['#2f6f5e','#b9d6c6'],im=img(k);
var facts=[['Бала билеті',plabel(s,'child')],['Аралау уақыты',s.duration],['Ең жақсы уақыт',s.season],['Жұмыс уақыты',s.hours]].map(function(f){return '<div class="fact"><span>'+f[0]+'</span><p>'+esc(f[1])+'</p></div>'}).join('');
return shell('places','<section class="detail-hero" style="--c1:'+a[0]+';--c2:'+a[1]+'"><div class="detail-hero-copy"><span class="detail-kicker">'+esc(s.category)+' · '+esc(C[c].name)+'</span><h1>'+esc(s.name)+'</h1><p>'+esc(s.description)+'</p><div class="detail-actions"><a class="primary-button light" href="#/calc?city='+c+'&spots='+k+'">Есепке қосу <span>→</span></a></div></div><div class="detail-hero-price"><span class="label">Ересек билеті</span><strong>'+esc(plabel(s))+'</strong><span class="badge '+(s.verified?'badge-ok':'badge-est')+'">'+(s.verified?'Баға тексерілген · '+esc(D.pricesCheckedAt):'Баға шамамен')+'</span></div></section>'+(im?'<section class="section tight"><img src="'+im+'" alt="'+esc(s.name)+'" style="width:100%;max-height:420px;object-fit:cover;border-radius:6px"></section>':'')+'<section class="section tight"><div class="fact-grid four">'+facts+'</div></section><section class="section tight"><div class="detail-main"><h2>Орын туралы</h2><p>'+esc(s.details)+'</p>'+(s.address?'<p class="address"><strong>Мекенжайы:</strong> '+esc(s.address)+'</p>':'')+(s.tip?'<p><strong>Кеңес:</strong> '+esc(s.tip)+'</p>':'')+'</div></section>')};
V.routes=function(){var h=Object.keys(D.routes).map(function(k){var st=D.routes[k],i=D.routeInfo[k],days={};st.forEach(function(x){(days[x.day]=days[x.day]||[]).push(x)});
var d=Object.keys(days).sort(function(a,b){return a-b}).map(function(n){return '<div class="fact" style="margin-bottom:10px"><span>'+n+'-күн</span>'+days[n].map(function(x){var s=P[x.city][x.spot];return '<p><strong>'+esc(s.name)+'</strong> ('+esc(x.time)+') — '+esc(x.note)+' <em>'+esc(plabel(s))+'</em></p>'}).join('')+'</div>'}).join('');
return '<section class="section tight" id="'+k+'"><h2>'+esc(i.title)+'</h2><p class="muted">'+esc(i.description)+'</p>'+d+'<p><strong>Билеттер: ересек '+money(routeTotal(st,'price'))+' · бала '+money(routeTotal(st,'child'))+'</strong></p></section>'}).join('');
return shell('routes',head('Дайын <em>маршруттар.</em>','','Күндік бағдарлама және ересек пен балаға арналған билет құны.')+h)};
V.tips=function(){var h=Object.keys(D.tips).map(function(s){return '<section class="section tight"><h2>'+esc(s)+'</h2><div class="fact-grid">'+D.tips[s].map(function(t){return '<div class="fact"><span>'+esc(t.title)+'</span><p>'+esc(t.text)+'</p></div>'}).join('')+'</div></section>'}).join('');return shell('tips',head('Туристерге <em>кеңестер.</em>','','Ақша, көлік, маусым және этикет.')+h)};
function calcTrip(c,sel,ad,ch,days,hk,mk,taxi,extra){var L=[],ppl=ad+ch,nights=Math.max(0,days-1),cs=D.costs[c],t=0,e=0,names=[];
for(var k in P[c]){if(sel.indexOf(k)<0)continue;var s=P[c][k];names.push(s.name);t+=s.price*ad+s.child*ch;if(extra)e+=s.extra*ppl}
if(names.length)L.push(['Билеттер мен кіру жарналары',t,names.join(', ')]);if(e>0)L.push(['Орынға дейінгі жол',e,'Әр адамға топтық тур немесе трансфер']);
if(hk!=='none'&&cs[hk]&&nights>0){var pr=cs[hk].price;if(hk==='hostel')L.push(['Тұрғын үй',ppl*nights*pr,cs[hk].label+': '+ppl+' орын × '+nights+' түн']);else{var r=Math.ceil(ppl/2);L.push(['Тұрғын үй',r*nights*pr,cs[hk].label+': '+r+' бөлме × '+nights+' түн'])}}
if(mk!=='none'&&cs[mk])L.push(['Тамақ',Math.round(cs[mk].price*days*(ad+ch*.5)),cs[mk].label+', '+days+' күн']);
if(taxi>0&&cs.taxi){var cars=Math.ceil(ppl/4);L.push(['Такси',cs.taxi.price*taxi*days*cars,taxi+' сапар күніне, '+cars+' көлік'])}
var tot=L.reduce(function(a,l){return a+l[1]},0);return{L:L,tot:tot,per:ppl?Math.round(tot/ppl):0}}
V.calc=function(q){var c=q.city&&C[q.city]?q.city:'almaty',sel=(q.spots||'').split(',');
var spots=Object.keys(P[c]).map(function(k){var s=P[c][k];return '<label class="check-item"><input type="checkbox" class="cs" value="'+k+'"'+(sel.indexOf(k)>=0?' checked':'')+'><span class="check-text"><strong>'+esc(s.name)+'</strong><small>Ересек: '+esc(plabel(s))+' · бала: '+esc(plabel(s,'child'))+'</small></span></label>'}).join('');
function so(o,cur,u){return Object.keys(o).map(function(k){var pr=D.costs[c][k]?' — '+money(D.costs[c][k].price)+u:'';return '<option value="'+k+'"'+(cur===k?' selected':'')+'>'+esc(o[k]+pr)+'</option>'}).join('')}
return shell('calc',head('Сапар <em>калькуляторы.</em>','','Билет, тұрғын үй, тамақ және такси құнын есептеңіз.')+'<section class="section tight"><div class="calc-layout"><form class="calc-form" id="cf" onsubmit="return false"><div class="calc-step"><h2>Қала</h2><label class="field wide"><select id="cc">'+Object.keys(C).map(function(k){return '<option value="'+k+'"'+(k===c?' selected':'')+'>'+esc(C[k].name)+'</option>'}).join('')+'</select></label></div><div class="calc-step"><h2>1. Орындар</h2><div class="check-list">'+spots+'</div><label class="check-item soft"><input type="checkbox" id="ex" checked><span class="check-text"><strong>Алыс орындарға дейінгі жолды ескеру</strong><small>Мысалы, Алматыдан Көлсайға топтық тур</small></span></label></div><div class="calc-step"><h2>2. Топ және мерзім</h2><div class="form-grid"><label class="field"><span>Ересектер</span><input id="ad" type="number" min="1" max="20" value="2"></label><label class="field"><span>Балалар</span><input id="ch" type="number" min="0" max="20" value="0"></label><label class="field"><span>Сапар күндері</span><input id="dy" type="number" min="1" max="21" value="3"></label><label class="field"><span>Күніне такси сапары</span><input id="tx" type="number" min="0" max="8" value="2"></label></div></div><div class="calc-step"><h2>3. Тұрғын үй және тамақ</h2><div class="form-grid"><label class="field wide"><span>Тұрғын үй</span><select id="ho">'+so(D.hotelOptions,'hotel3',' түніне')+'</select></label><label class="field wide"><span>Тамақ</span><select id="me">'+so(D.mealOptions,'meals',' күніне')+'</select></label></div><p class="muted small-text">Бөлме екі адамға есептелген, тамақта бала ересектің жартысына тең, такси — төрт адамға бір көлік.</p></div></form><aside class="calc-result" id="cr"></aside></div></section>')};
function fillCalc(){var f=$('#cf');if(!f)return;function n(id,a,b){return Math.max(a,Math.min(b,parseInt($(id).value)||0))}
var sel=[].map.call(document.querySelectorAll('.cs:checked'),function(x){return x.value}),r=calcTrip($('#cc').value,sel,n('#ad',1,20),n('#ch',0,20),n('#dy',1,21),$('#ho').value,$('#me').value,n('#tx',0,8),$('#ex').checked);
$('#cr').innerHTML=r.L.length?'<div class="result-total"><span>Жалпы құны</span><strong>'+money(r.tot)+'</strong><small>Бір адамға: '+money(r.per)+'</small></div><ul class="result-lines">'+r.L.map(function(l){return '<li><div><strong>'+esc(l[0])+'</strong><small>'+esc(l[2])+'</small></div><b>'+money(l[1])+'</b></li>'}).join('')+'</ul>':'<div class="result-empty"><span>₸</span><strong>Есептейтін ештеңе жоқ</strong><small>Орынды, тұрғын үйді немесе тамақты таңдаңыз.</small></div>'}
function route(){var r=parse(),v=V[r.p[0]]||V[''];document.getElementById('app').innerHTML=v(r.q,r.p);window.scrollTo(0,0);
